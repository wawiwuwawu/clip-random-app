name: Build Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: pip install PySide6 faster-whisper pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Download FFmpeg (gyan.dev release essentials)
        shell: pwsh
        run: |
          curl.exe -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_dl
          $bin = Join-Path $PWD "ffmpeg-2026-07-02-git-95a888b9ca-full_build\bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          $src = Get-ChildItem "ffmpeg_dl" -Directory | Select-Object -First 1
          Copy-Item (Join-Path $src.FullName "bin\ffmpeg.exe")  $bin
          Copy-Item (Join-Path $src.FullName "bin\ffprobe.exe") $bin

      - name: Build with PyInstaller
        run: pyinstaller SmartVideoCompiler.spec --noconfirm

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist\SmartVideoCompiler\* -DestinationPath SmartVideoCompiler_Portable.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc SmartVideoCompiler.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartVideoCompiler-build
          path: |
            SmartVideoCompiler_Setup.exe
            SmartVideoCompiler_Portable.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SmartVideoCompiler_Setup.exe
            SmartVideoCompiler_Portable.zip
